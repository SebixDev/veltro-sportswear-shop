<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="VELTRO – Onlineshop für moderne Sportswear">
    <title>VELTRO Sportswear</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="site-header">
        <a class="logo" href="index.html">VELTRO</a>

        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="nav">Menü</button>

        <nav id="nav" class="nav" aria-label="Hauptnavigation">
            <a href="#kategorien">Training</a>
            <a href="#kategorien">Running</a>
            <a href="#kategorien">Freizeit</a>
        </nav>

        <a class="cart" href="#">Warenkorb</a>
    </header>

    <main>
        <section class="hero">
            <div class="hero-box">
                <h1>Made to Move.</h1>
                <p>Sportswear für Training, Running und Freizeit.</p>
                <a class="btn" href="#kategorien">Jetzt entdecken</a>
            </div>
        </section>

        <section id="kategorien" class="section">
            <h2>Kategorien</h2>
            <div class="grid grid-3">
                <a class="category" href="#"><h3>Training</h3></a>
                <a class="category" href="#"><h3>Running</h3></a>
                <a class="category" href="#"><h3>Freizeit</h3></a>
            </div>
        </section>

        <section class="section">
            <h2>Produkte</h2>
            <div id="product-list" class="grid grid-4"></div>
            <p id="product-error" class="product-error" role="alert"></p>
        </section>
    </main>

    <footer class="site-footer">
        <div class="footer-brand">
            <p class="footer-logo">VELTRO</p>
            <p>Made to Move.</p>
        </div>

        <nav class="footer-nav" aria-label="Rechtliches">
            <a href="#">Impressum</a>
            <a href="#">Datenschutz</a>
            <a href="#">AGB</a>
        </nav>

        <p class="copyright">© 2026 VELTRO Sportswear</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
